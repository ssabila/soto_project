<svg width="200" height="200" viewBox="0 0 200 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="retroPattern2" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Warm gradient background -->
      <rect width="40" height="40" fill="#FFF8E7"/>
      
      <!-- Diagonal stripes subtle -->
      <line x1="0" y1="0" x2="40" y2="40" stroke="#FFE8C1" stroke-width="1" opacity="0.4"/>
      <line x1="40" y1="0" x2="0" y2="40" stroke="#FFE8C1" stroke-width="1" opacity="0.4"/>
      
      <!-- Vintage dots cluster -->
      <circle cx="10" cy="10" r="2.5" fill="#FFB84D" opacity="0.7"/>
      <circle cx="12" cy="12" r="1.5" fill="#FF9999" opacity="0.6"/>
      <circle cx="8" cy="14" r="1.5" fill="#FFDA7D" opacity="0.6"/>
      
      <!-- Corner stars/sparkles -->
      <g opacity="0.5">
        <circle cx="30" cy="8" r="2" fill="#FF7B7B"/>
        <circle cx="32" cy="8" r="1" fill="#FFD9A3"/>
        <circle cx="30" cy="10" r="1" fill="#FFD9A3"/>
        <circle cx="28" cy="8" r="1" fill="#FFD9A3"/>
        <circle cx="30" cy="6" r="1" fill="#FFD9A3"/>
      </g>
      
      <!-- Wave pattern bottom -->
      <path d="M 0 30 Q 10 25, 20 30 T 40 30" stroke="#FFD9A3" stroke-width="1" fill="none" opacity="0.5"/>
      
      <!-- Cross accent -->
      <line x1="20" y1="15" x2="20" y2="35" stroke="#FF9999" stroke-width="0.5" opacity="0.3"/>
      <line x1="10" y1="25" x2="30" y2="25" stroke="#FF9999" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Main background -->
  <rect width="200" height="200" fill="#FFF8E7"/>
  
  <!-- Pattern overlay -->
  <rect width="200" height="200" fill="url(#retroPattern2)"/>
  
  <!-- Top and bottom frame accent strips -->
  <rect x="0" y="0" width="200" height="8" fill="#FFD9A3" opacity="0.6"/>
  <rect x="0" y="192" width="200" height="8" fill="#FFD9A3" opacity="0.6"/>
  
  <!-- Left and right edge accent -->
  <rect x="0" y="0" width="8" height="200" fill="#FFD9A3" opacity="0.4"/>
  <rect x="192" y="0" width="8" height="200" fill="#FFD9A3" opacity="0.4"/>
  
  <!-- Decorative geometric shapes -->
  <g opacity="0.3">
    <!-- Triangle top right -->
    <polygon points="180,15 190,30 170,30" fill="#FF9999"/>
    <!-- Small square bottom left -->
    <rect x="15" y="170" width="15" height="15" fill="#FFDA7D"/>
    <!-- Circle accent -->
    <circle cx="150" cy="170" r="8" fill="none" stroke="#FFB84D" stroke-width="1.5"/>
  </g>
</svg>