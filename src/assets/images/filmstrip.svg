<svg width="100" height="100" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pattern definitions -->
  <defs>
    <pattern id="filmstripPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Black background -->
      <rect width="100" height="100" fill="#1a1a1a"/>
      
      <!-- Horizontal frame divider lines -->
      <line x1="0" y1="0" x2="100" y2="0" stroke="#444" stroke-width="2"/>
      <line x1="0" y1="100" x2="100" y2="100" stroke="#444" stroke-width="2"/>
      
      <!-- Left sprocket holes -->
      <circle cx="8" cy="25" r="3.5" fill="#111"/>
      <circle cx="8" cy="50" r="3.5" fill="#111"/>
      <circle cx="8" cy="75" r="3.5" fill="#111"/>
      
      <!-- Right sprocket holes -->
      <circle cx="92" cy="25" r="3.5" fill="#111"/>
      <circle cx="92" cy="50" r="3.5" fill="#111"/>
      <circle cx="92" cy="75" r="3.5" fill="#111"/>
      
      <!-- Subtle texture lines on sprocket sides -->
      <line x1="3" y1="0" x2="3" y2="100" stroke="#333" stroke-width="1" opacity="0.6"/>
      <line x1="97" y1="0" x2="97" y2="100" stroke="#333" stroke-width="1" opacity="0.6"/>
      
      <!-- Inner frame border -->
      <rect x="15" y="5" width="70" height="90" fill="none" stroke="#555" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Use the pattern -->
  <rect width="100" height="100" fill="url(#filmstripPattern)"/>
</svg>